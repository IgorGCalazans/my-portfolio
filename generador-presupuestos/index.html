<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Presupuesto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="proyecto-container">
    <div class="proyecto-calculadora">
        <h1>Generador de Presupuestos</h1>
        <p>Introduce la base imponible para calcular el IVA y el IRPF de tu factura.</p>

        <div class="campo-grupo">
            <label for="valorBruto">Base Imponible (€): </label>
            <input type="number" id="valorBruto" placeholder="Ej: 1000">
        </div>

        <button onclick="generarPresupuesto()">Calcular Factura</button>

        <div id="resultado" class="resultado-zona">

        </div>
    </div>
</div>

    <script>

        function generarPresupuesto() {

            let entradaUsuario = document.getElementById('valorBruto').value;
            let valorBruto = parseFloat(entradaUsuario);

            if (isNaN(valorBruto) || valorBruto <= 0) {
                document.getElementById('resultado').innerHTML = "<p class='error'>Por favor,introduce un número válido.</p>";
                return;
            }

            let iva = valorBruto * 0.21; 
            let irpf = valorBruto * 0.15;
            let valorFinal = valorBruto + iva - irpf;
            
            let formatoEuro = new Intl.NumberFormat('es-ES', {
                style: 'currency',
                currency: 'EUR'
            });

            document.getElementById('resultado').innerHTML = `
                <div class="recibo-resumen">
                    <p><strong>Base Imponible:</strong> ${formatoEuro.format(valorBruto)}</P>
                    <p><strong>IVA Aplicado (21%):</strong> + ${formatoEuro.format(iva)}</p>
                    <p><strong>IRPF Retenido (15%):</strong> - ${formatoEuro.format(irpf)}</p>
                    <hr>
                    <h3>Total Líquido: ${formatoEuro.format(valorFinal)}</h3>
                </div>    
            
            `;          

        }
    </script>

</body>
</html>
